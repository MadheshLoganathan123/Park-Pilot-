name: park_pilot
description: Smart Parking Management & Slot Reservation App in Flutter

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.0
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
